version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nerv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nerv
    ports:
      - '5432:5432'
    volumes:
      - nerv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nerv']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nerv-pgdata:
    driver: local
