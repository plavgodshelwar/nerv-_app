<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nerv</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <!-- v0.3.4 type revamp: Press Start 2P stays as the BRAND display face
         (small caps labels only); body/UI moves to Inter and code/terminal to
         JetBrains Mono. The pixel body fonts (Pixelify/VT323) read as toy-like
         and strained at data-dense sizes.
         v0.4.6: these three faces are BUNDLED (src/renderer/src/design/fonts.css)
         rather than fetched from fonts.googleapis.com, which is blocked in
         mainland China. The CSP above no longer allows either Google font host. -->
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        overflow: hidden; background: #100918; color: #fff8ff;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .boot-video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; opacity: .8;
      }
      #cth-splash .veil {
        position: absolute; inset: 0;
        background: radial-gradient(circle at center, rgba(18, 8, 29, .1), rgba(9, 4, 15, .78));
      }
      #cth-splash .brand { position: relative; display: grid; place-items: center; gap: 12px; }
      #cth-splash .mk {
        display: grid; place-items: center; width: 56px; height: 56px;
        background: rgba(21, 11, 34, .82); color: #f5eaff; border: 3px solid #c98cff;
        font-family: "Press Start 2P", monospace; font-size: 16px; letter-spacing: -2px;
        box-shadow: 0 0 28px rgba(201, 140, 255, .5);
      }
      #cth-splash .title { font-family: "Press Start 2P", monospace; font-size: 13px; text-shadow: 0 0 16px rgba(211, 158, 255, .85); }
      #cth-splash .hint { font-size: 15px; color: #f1d9ff; text-shadow: 0 1px 5px #100918; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <video class="boot-video" autoplay muted loop playsinline aria-hidden="true">
          <source src="/nerv-boot.mp4" type="video/mp4" />
        </video>
        <div class="veil"></div>
        <div class="brand">
          <div class="mk">NV</div>
          <div class="title">NERV</div>
          <div class="hint">initializing command center…</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
